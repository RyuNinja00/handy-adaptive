name: Build Marinara image POC ZIP
on:
  push:
    branches: [feature/marinara-image-poc]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build extension ZIP
        run: node scripts/build-marinara.mjs
      - name: Check archive
        run: unzip -t dist/handy-adaptive-marinara.zip
      - name: Commit rebuilt extension archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/handy-adaptive-marinara.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: update Marinara extension ZIP [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: handy-adaptive-marinara-image-poc
          path: dist/handy-adaptive-marinara.zip
