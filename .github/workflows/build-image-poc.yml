name: Verify extension and release packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install --no-save --package-lock=false playwright@1.58.2 && pip install playwright==1.58.0
      - run: npx playwright install --with-deps chromium && python -m playwright install chromium
      - run: npm test
      - run: node --check image-bridge/server.mjs && git diff --exit-code -- dist && test -z "$(git ls-files --others --exclude-standard dist)"
